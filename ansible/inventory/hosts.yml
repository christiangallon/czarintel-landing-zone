---
# -----------------------------------------------------------------------------
# CzarIntel static inventory.
# In AWS use the dynamic plugin instead (inventory/aws_ec2.yml) - both files
# produce the same group names so playbooks are inventory-agnostic:
#   ansible-playbook -i inventory/aws_ec2.yml site.yml
# Hosts are reached through the SSM/bastion ProxyJump defined in group_vars/all.
# -----------------------------------------------------------------------------
all:
  children:
    jenkins:
      children:
        jenkins_controllers:
          hosts:
            jenkins-ctrl-01:
              ansible_host: 10.10.10.20
        jenkins_agents:
          hosts:
            jenkins-agent-01:
              ansible_host: 10.10.10.31
            jenkins-agent-02:
              ansible_host: 10.10.10.32
    k8s_nodes:
      hosts:
        eks-node-01:
          ansible_host: 10.10.20.11
          cloud: aws
        eks-node-02:
          ansible_host: 10.10.20.12
          cloud: aws
        aks-node-01:
          ansible_host: 10.20.20.11
          cloud: azure
        gke-node-01:
          ansible_host: 10.30.20.11
          cloud: gcp
    mysql:
      hosts:
        mysql-01:
          ansible_host: 10.10.30.11
          mysql_server_id: 1
          mysql_role: primary
        mysql-02:
          ansible_host: 10.10.30.12
          mysql_server_id: 2
          mysql_role: replica
    proxysql:
      hosts:
        proxysql-01:
          ansible_host: 10.10.30.21
    docker_hosts:
      children:
        jenkins_agents:
