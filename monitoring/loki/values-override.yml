# =============================================================================
# CzarIntel — Loki (log aggregation) values for grafana/loki chart 6.16.0
#
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki --version 6.16.0 \
#     -n monitoring -f monitoring/loki/values-override.yml
#
# Topology: SingleBinary + gateway. Grafana's `loki` datasource and in-cluster
# shippers use http://loki-gateway.monitoring.svc.cluster.local. VMs (Fluent Bit
# installed by ansible/roles/fluent_bit) push over mTLS to
# https://loki.czarintel.io/loki/api/v1/push (gateway.ingress below).
#
# Retention: 90 days hot (HIPAA 164.312(b) audit controls, PCI 10.7 requires
# 3 months immediately available). Long-term (1y+) archive lives in the
# versioned, KMS-encrypted S3 backup bucket (terraform/modules/aws).
#
# The monitoring namespace is PSA "privileged" (node-exporter needs host
# access) with baseline audit/warn; Loki itself does not need that exception,
# so every pod below meets the "restricted" profile anyway: non-root, read-only
# root FS, all capabilities dropped, seccomp RuntimeDefault.
# =============================================================================
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single-tenant; access is gated by Grafana (Entra ID SSO)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 2160h      # 90 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_query_series: 5000
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 100Gi
    storageClass: gp3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 4Gi }
  podLabels:
    czarintel.io/owner: platform-engineering
    czarintel.io/cost-center: CZ-1000

gateway:
  enabled: true
  replicas: 2
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  # External push endpoint for VMs (Fluent Bit via ansible/roles/fluent_bit).
  # Zero Trust: TLS + mandatory client certificate (mTLS) + private CIDRs only.
  # In-cluster shippers keep using http://loki-gateway.monitoring.svc.cluster.local.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
      nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
      nginx.ingress.kubernetes.io/auth-tls-secret: monitoring/czarintel-logging-ca
      nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
    hosts:
      - host: loki.czarintel.io
        paths:
          - path: /loki/api/v1/push
            pathType: Prefix
    tls:
      - secretName: loki-czarintel-io-tls
        hosts:
          - loki.czarintel.io

# Scalable-mode targets disabled in SingleBinary mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Memcached caches are unnecessary at this log volume; re-enable when
# ingest exceeds ~50 GB/day.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Built-in canary + self-monitoring disabled: Loki is scraped by the
# kube-prometheus-stack ServiceMonitor below instead.
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kps
