{{- if and .Values.persistence.enabled .Values.persistence.backup.enabled }}
# Standalone PVC for logical backups (mysqldump / xtrabackup output).
# Data volumes are provisioned per-replica by the StatefulSet volumeClaimTemplates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mysql.fullname" . }}-backup
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.backup.size }}
{{- end }}
