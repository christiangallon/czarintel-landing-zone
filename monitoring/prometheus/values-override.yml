# -----------------------------------------------------------------------------
# kube-prometheus-stack overrides (chart 65.x)
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --version 65.1.1 -f monitoring/prometheus/values-override.yml
#   kubectl apply -f monitoring/prometheus/custom-rules/
# -----------------------------------------------------------------------------
fullnameOverride: kps

commonLabels:
  czarintel.io/owner: sre
  czarintel.io/cost-center: CZ-1000

defaultRules:
  create: true
  rules:
    etcd: false              # managed control planes (EKS/AKS/GKE) hide etcd
    kubeScheduler: false
    kubeControllerManager: false

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: true

# ----------------------------- Prometheus ------------------------------------
prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    retentionSize: 45GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    externalLabels:
      cluster: czarintel-prod-eks
      environment: production
    # Discover ServiceMonitors / PrometheusRules from every namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 6Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
    podAntiAffinity: hard
    # Honour prometheus.io/* pod annotations used by api-service & mysql
    additionalScrapeConfigs:
      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [production, staging]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

# ----------------------------- Alertmanager ----------------------------------
alertmanager:
  alertmanagerSpec:
    replicas: 3
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Webhook URLs / routing keys are mounted from a Secret, never inline
    secrets:
      - alertmanager-receivers
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
    route:
      receiver: slack-default
      group_by: [alertname, namespace, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: pagerduty-critical
          continue: true
        - matchers: ['severity=~"critical|warning"']
          receiver: slack-default
        - matchers: ['alertname="Watchdog"']
          receiver: "null"
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: slack-default
        slack_configs:
          - channel: "#czarintel-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Severity:* {{ .Labels.severity }} | *Namespace:* {{ .Labels.namespace }}
              *Summary:* {{ .Annotations.summary }}
              *Details:* {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
              {{ end }}
      - name: pagerduty-critical
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-receivers/pagerduty-routing-key
            send_resolved: true
            severity: critical

# ----------------------------- Grafana ---------------------------------------
grafana:
  replicas: 2
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.czarintel.io
    auth:
      disable_login_form: true
    auth.generic_oauth:
      enabled: true
      name: Entra ID
      allow_sign_up: true
      client_id: $__file{/etc/secrets/grafana-oauth/client-id}
      client_secret: $__file{/etc/secrets/grafana-oauth/client-secret}
      scopes: openid email profile
      auth_url: https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/authorize
      token_url: https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/token
      role_attribute_path: contains(groups[*], 'czarintel-platform-admins') && 'Admin' || contains(groups[*], 'czarintel-sre') && 'Editor' || 'Viewer'
    security:
      cookie_secure: true
      disable_gravatar: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
  extraSecretMounts:
    - name: grafana-oauth
      secretName: grafana-oauth
      mountPath: /etc/secrets/grafana-oauth
      readOnly: true
  persistence:
    enabled: true
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts: [grafana.czarintel.io]
    tls:
      - secretName: grafana-tls
        hosts: [grafana.czarintel.io]

# ----------------------------- Exporters -------------------------------------
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[app.kubernetes.io/name,czarintel.io/owner]
    - deployments=[app.kubernetes.io/name,czarintel.io/owner,czarintel.io/cost-center]
