# kubectl apply -k monitoring/grafana
# Packs every dashboard into a ConfigMap the Grafana sidecar auto-discovers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: czarintel-landing-zone
  annotations:
    grafana_folder: CzarIntel
configMapGenerator:
  - name: czarintel-dashboards
    files:
      - dashboards/api-slo.json
      - dashboards/platform-overview.json
      - dashboards/mysql.json
      - dashboards/security-posture.json
