{{- if not .Values.auth.existingSecret }}
{{- /*
  Reuse previously generated passwords on upgrade so `helm upgrade` never
  rotates credentials underneath a running database.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "mysql.fullname" .) }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.fullname" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mysql-root-password: {{ .Values.auth.rootPassword | default (get $data "mysql-root-password" | default "" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  mysql-password: {{ .Values.auth.password | default (get $data "mysql-password" | default "" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  mysql-exporter-password: {{ .Values.auth.exporterPassword | default (get $data "mysql-exporter-password" | default "" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
  mysql-database: {{ .Values.auth.database | b64enc | quote }}
  mysql-user: {{ .Values.auth.username | b64enc | quote }}
{{- end }}
