---
jenkins_java_package: openjdk-17-jre-headless
jenkins_agent_user: jenkins
jenkins_agent_home: /var/lib/jenkins
jenkins_controller_url: "https://jenkins.czarintel.io"
jenkins_http_port: 8080
jenkins_java_opts: "-Xms1g -Xmx4g -XX:+UseG1GC -Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP=\"sandbox; default-src 'self';\""
# Build tooling installed on agents (Jenkinsfile stages depend on these)
jenkins_agent_packages:
  - git
  - make
  - jq
  - unzip
  - python3-pip
  - python3-venv
jenkins_trivy_version: "0.56.2"
jenkins_helm_version: "3.16.2"
jenkins_kubectl_version: "1.31.1"
