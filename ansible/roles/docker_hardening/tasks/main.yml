---
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_os_family == 'Debian'
- name: Install Docker prerequisites (Debian)
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Add Docker GPG key (Debian)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == 'Debian'

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  when: ansible_os_family == 'Debian'

- name: Add Docker yum repository (RHEL)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "https://download.docker.com/linux/rhel/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
  when: ansible_os_family == 'RedHat'

- name: Install Docker CE
  ansible.builtin.package:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
    state: present

- name: CIS 1.2.1 | Create dedicated /etc/docker directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: CIS 2.x | Deploy hardened daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: CIS 2.8 | Configure subordinate IDs for user-namespace remapping
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "dockremap:231072:65536"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: [/etc/subuid, /etc/subgid]
  when: docker_userns_remap | length > 0

- name: CIS 3.x | Ensure docker socket and unit file permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /lib/systemd/system/docker.service, group: root, mode: "0644" }
    - { path: /lib/systemd/system/docker.socket, group: root, mode: "0644" }
  failed_when: false

- name: CIS 1.1.x | Add authorised users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Weekly prune of dangling images/build cache (keeps agents lean)
  ansible.builtin.cron:
    name: docker-prune
    special_time: weekly
    job: "/usr/bin/docker system prune -af --filter 'until=168h' >/var/log/docker-prune.log 2>&1"
    user: root

- name: Verify daemon configuration took effect
  ansible.builtin.command: docker info --format '{{ "{{" }} .SecurityOptions {{ "}}" }}'
  register: docker_security_opts
  changed_when: false

- name: Assert user-namespace remapping is active
  ansible.builtin.assert:
    that: "'userns' in docker_security_opts.stdout"
    fail_msg: "userns-remap not active - CIS Docker 2.8 failing"
  when: docker_userns_remap | length > 0
